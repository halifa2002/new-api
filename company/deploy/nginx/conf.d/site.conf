# 公司版反向代理配置
#
# 三个界面对应三个域名，上线时只需改 server_name 和证书路径：
#
#   admin.<域名>   管理员后台（New API 官方前端 + 管理 API）
#   api.<域名>     API 网关，给客户程序调用（OpenAI 兼容接口）
#   www.<域名>     品牌官网（静态站，构建产物在 frontend/apps/website/out）
#
# 本文件的关键改动：
#   后台根路径 / 直接 302 到 /dashboard，不再展示 New API 官方的营销主页。
#   放在反代层做，官方前端代码一行不动，官方升级零冲突。
#
# 挂载方式（docker compose 里给 nginx 服务加）：
#   volumes:
#     - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
#     - ./deploy/nginx/certs:/etc/nginx/certs:ro
#     - ./frontend/apps/website/out:/usr/share/nginx/html:ro

# 让所有跳转发相对地址（如 Location: /dashboard），不拼协议和主机。
# 这样外面无论套端口映射（本地 8080）还是 CDN，浏览器都能正确解析。
absolute_redirect off;

upstream newapi_backend {
    server new-api:3000;
    keepalive 32;
}

# 所有转发都要带上的头
# 说明：Host 用 $host，New API 用它拼回调地址和校验来源
#       X-Forwarded-Proto 让后端知道外部是 http 还是 https，否则 Cookie 的 Secure 标记会错

# ─── 管理员后台 ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.example.com;   # ← 改成你的后台域名

    client_max_body_size 20m;        # 多模态请求可能带图片

    # ── 后台 IP 白名单（md 第 369 行：管理员后台「可增加 VPN、IP 白名单或额外身份验证」）──
    # 默认关闭。等公司给出固定出口 IP 后，把下面几行取消注释、换成真实网段，再 nginx -s reload。
    # 匹配顺序：从上往下，命中即停 —— allow 自己的网段要写在 deny all 前面。
    #
    # allow 10.0.0.0/8;          # 内网 / VPN 网段
    # allow 203.0.113.45;        # 公司固定出口 IP
    # allow 198.51.100.0/24;     # 备用线路
    # deny all;
    #
    # 应急：万一把自己关在外面，注释掉 deny all 那一行再 reload 就恢复。
    # 只加在这一段：api 与 www 面对公众，加了会挡掉所有用户。
    # 前置 CDN 时 $remote_addr 是 CDN 的地址，要白名单真实来源需改用 real_ip 模块。

    # 根路径直接进控制台
    # 未登录时 /dashboard 会被前端守卫带到登录页，不会出现死循环
    location = / {
        return 302 /dashboard;
    }

    location / {
        proxy_pass http://newapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后台有长轮询与流式响应，关掉缓冲、拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ─── API 网关 ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.example.com;     # ← 改成你的 API 域名

    client_max_body_size 20m;

    location / {
        proxy_pass http://newapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式返回必须关缓冲，否则客户端要等到整段生成完才收到第一个 token
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ─── 品牌官网（静态站） ────────────────────────────────────────────────────
server {
    listen 80;
    server_name www.example.com;     # ← 改成你的官网域名
    root /usr/share/nginx/html;
    index index.html;

    # Next.js 静态导出的路由：先找文件，找不到再找 xxx.html，最后回 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带哈希的构建产物可以长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}

# ─── HTTPS ────────────────────────────────────────────────────────────────
# 证书就绪后，把上面三个 server 的 listen 80 改成下面这两行，
# 并取消本段注释（路径换成实际证书位置）：
#
#   listen 443 ssl;
#   http2 on;
#
#   ssl_certificate     /etc/nginx/certs/<域名>.crt;
#   ssl_certificate_key /etc/nginx/certs/<域名>.key;
#   ssl_protocols       TLSv1.2 TLSv1.3;
#
# 另外再加一个 80 端口的 server 做跳转：
#
# server {
#     listen 80;
#     server_name admin.example.com api.example.com www.example.com;
#     return 301 https://$host$request_uri;
# }
